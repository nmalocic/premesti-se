name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore PremestiSe.sln --locked-mode
      - name: Build Release solution
        run: dotnet build PremestiSe.sln -c Release --no-restore
      - name: Run isolated API unit tests
        run: >-
          dotnet test tests/PremestiSe.Api.UnitTests/PremestiSe.Api.UnitTests.csproj
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults/unit
      - name: Require executed unit tests
        run: python3 .github/scripts/verify-test-results.py TestResults/unit/unit.trx
      - name: Verify .NET formatting
        run: dotnet format PremestiSe.sln --verify-no-changes --no-restore
      - name: Publish and collect .NET outputs
        run: bash .github/scripts/collect-dotnet-artifacts.sh
      - name: Upload API
        uses: actions/upload-artifact@v4
        with:
          name: api-release
          path: artifacts/api/
          if-no-files-found: error
          retention-days: 14
      - name: Upload importer
        uses: actions/upload-artifact@v4
        with:
          name: importer-release
          path: artifacts/importer/
          if-no-files-found: error
          retention-days: 14
      - name: Upload database deployment assemblies
        uses: actions/upload-artifact@v4
        with:
          name: database-assemblies
          path: artifacts/database/
          if-no-files-found: error
          retention-days: 14
      - name: Upload available .NET test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-unit-results
          path: TestResults/unit/*.trx
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run web unit tests
        run: npm run test:unit
      - name: Require executed unit tests
        run: python3 ../.github/scripts/verify-test-results.py test-results/unit/junit.xml
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Build production bundle
        run: npm run build
      - name: Verify required web outputs
        run: |
          test -s dist/index.html
          compgen -G 'dist/assets/*.js' > /dev/null
          compgen -G 'dist/assets/*.css' > /dev/null
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload available web test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-results
          path: web/test-results/unit/junit.xml
          if-no-files-found: warn
          retention-days: 14
