name: premesti-se
services:
  veloxdb:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/VeloxDB.Dockerfile
    ports:
      - "127.0.0.1:${DATABASE_PORT:-7568}:7568"
    volumes:
      - database-data:/var/lib/veloxdb
      - database-logs:/var/log/veloxdb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "dotnet", "/probe/PremestiSe.Api.dll", "--check-database"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/Api.Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Address: veloxdb:7568
      Database__TimeoutSeconds: "3"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
    depends_on:
      veloxdb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "PremestiSe.Api.dll", "--check-database"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
volumes:
  database-data:
  database-logs:
